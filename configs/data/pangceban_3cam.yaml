train:
  _target_: fastwam.datasets.lerobot.robot_video_dataset.RobotVideoDataset
  dataset_dirs:
    # - /root/autodl-fs/datasets/pangceban_left_right_data_20260602_658_delta_action
    - /root/autodl-fs/datasets/pangceban_left_right_data_20260629_738_v2_delta_action
  shape_meta:
    images:
      - key: head_left
      # - key: observation.images.head_left
        raw_shape: [3, 256, 256]
        shape: [3, 224, 224]
      - key: hand_left
      # - key: observation.images.hand_left
        raw_shape: [3, 256, 256]
        shape: [3, 224, 224]
      - key: hand_right
      # - key: observation.images.hand_right
        raw_shape: [3, 256, 256]
        shape: [3, 224, 224]
    action:
      - key: default
      # - key: action
        raw_shape: 28 # before transform
        shape: 28 # after transform
    state:
      - key: default
      # - key: observation.state
        raw_shape: 28 # before transform
        shape: 28 # after transform
    custom_action:
      - key: custom_action
        raw_shape: [32, 28]
  num_frames: 33
  global_sample_stride: 1
  action_video_freq_ratio: 4 # 32 action, 9 video frames
  video_size: [320, 224] # final resize video
  camera_key: null
  val_set_proportion: 0.0
  is_training_set: true
  skip_padding_as_possible: false
  concat_multi_camera: "lerobot"
  pretrained_norm_stats: /root/foresee/FastWAM/configs/pangceban_dataset_stats_0629.json
  processor:
    _target_: fastwam.datasets.lerobot.processors.fastwam_processor.FastWAMProcessor
    shape_meta: ${data.train.shape_meta}
    num_obs_steps: ${data.train.num_frames}
    num_output_cameras: 3
    action_output_dim: 28 # eef_pose (6) + gripper (1)
    proprio_output_dim: 28 # eef_pose (6) + gripper (2)
    # action & state normalization
    action_state_transforms: null
    # action_state_transforms:
    #   - _target_: fastwam.datasets.lerobot.transforms.libero.LiberoTransform
    use_stepwise_action_norm: False
    norm_default_mode: min/max
    norm_exception_mode: null

    action_state_merger:
      _target_: fastwam.datasets.lerobot.transforms.action_state_merger.ConcatLeftAlign

    train_transforms:
      - _target_: fastwam.datasets.lerobot.transforms.image.ToTensor
      - _target_: torchvision.transforms.Resize
        size: [224, 224]
    val_transforms:
      - _target_: fastwam.datasets.lerobot.transforms.image.ToTensor
      - _target_: torchvision.transforms.Resize
        size: [224, 224]
  text_embedding_cache_dir: /root/autodl-fs/ckpts/fast_wam/text_embeds_cache/libero
  context_len: 128
