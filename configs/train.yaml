# @package _global_

defaults:
  - _self_
  - data: null
  - model: null
  - task: null


output_dir: /root/autodl-fs/ckpts/fast_wam/runs/${now:%Y-%m-%d}_${now:%H-%M-%S}

# dataloading
batch_size: 2
num_workers: 4

# scheduler
lr_scheduler_type: "cosine"
learning_rate: 1.0e-4
num_epochs: 1
max_steps: null
log_every: 10
save_every: 100
eval_every: 50
eval_num_inference_steps: 10

# training
gradient_accumulation_steps: 1
mixed_precision: "bf16" # one of: [no, fp16, bf16]
seed: 42
max_grad_norm: 1.0
weight_decay: 0.0
resume: null

# wandb
wandb:
  enabled: true
  workspace: null
  project: fast-wam
  name: train
  group: null
  mode: online

# profiler (torch.profiler)
profiler:
  enabled: false
  skip_first: 10
  wait: 5
  warmup: 1
  active: 3
  repeat: 1
  record_shapes: true
  profile_memory: true
  with_stack: false

hydra:
  job:
    chdir: false
  run:
    dir: .
  output_subdir: null
